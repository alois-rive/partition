[package]
name = "partition"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Partition: compose, play and record music written as text (the native shell around the Rive app)"
repository = "https://github.com/alois-rive/partition"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.1"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
